# ==============================================================================
# CineBook - Render Blueprint Deployment Configuration
# ==============================================================================
# Use this Blueprint to deploy the entire stack (PostgreSQL + Django API + React Frontend)
# on Render with one click: Render Dashboard -> "New +" -> "Blueprint" -> Connect Repo.
# ==============================================================================

databases:
  # Managed PostgreSQL Database for persistent data storage
  - name: cinebook-db
    databaseName: cinebook
    user: cinebook_user
    plan: free
    region: oregon

services:
  # ----------------------------------------------------------------------------
  # 1. Django REST Framework Backend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: cinebook-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "./render-build.sh"
    startCommand: "gunicorn cinebook_backend.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: RAZORPAY_SIMULATED_MODE
        value: "true"
      - key: SEAT_HOLD_DURATION_MINUTES
        value: "5"
      - key: CANCELLATION_CUTOFF_HOURS
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: cinebook-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://cinebook-frontend.onrender.com"
      - key: FRONTEND_URL
        value: "https://cinebook-frontend.onrender.com"

  # ----------------------------------------------------------------------------
  # 2. React + Vite Frontend Static Site
  # ----------------------------------------------------------------------------
  - type: static
    name: cinebook-frontend
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "dist"
    routes:
      # SPA fallback rewrite rule for direct routes like /my-bookings and /staff/scan
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://cinebook-backend.onrender.com/api"
